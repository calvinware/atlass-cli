# Link check for README.md, AGENTS.md, and docs/**/*.md. The CI docs job runs:
#   lychee --config lychee.toml README.md AGENTS.md 'docs/**/*.md'
# Local links (files and #fragments) and external URLs are both checked.

include_fragments = "anchor-only"
max_retries = 2
retry_wait_time = 2
timeout = 20
max_concurrency = 8
no_progress = true

# Only 2xx counts as success. Rate limits (429) and other 4xx fail the check.
accept = ["200..=299"]

exclude = [
  # calvinware/atlass-cli is a private repository: its Actions page and CI badge return 404 to
  # unauthenticated requests, so lychee cannot check them. Pages under docs/ and AGENTS.md link
  # repository files with relative paths, which are checked locally.
  '^https://github\.com/calvinware/atlass-cli/actions/',
  # TEMPORARY, until the repository is public: README.md uses absolute file and banner URLs so it
  # renders on PyPI, and those also return 404 while the repository is private. tests/test_docs.py
  # checks that each one maps to a tracked file. Remove these two lines once the repository is
  # public, then rerun lychee (see docs/contributing.md#release).
  '^https://github\.com/calvinware/atlass-cli/blob/main/',
  '^https://raw\.githubusercontent\.com/calvinware/atlass-cli/main/',
]
