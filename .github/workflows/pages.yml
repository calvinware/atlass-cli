name: Pages

# Builds the MkDocs site from docs/ after CI succeeds on the current main commit. Pull requests
# never deploy; CI's docs job builds the same site for review. A repository owner must set
# Settings > Pages > Source to "GitHub Actions" once. See docs/contributing.md#documentation-site.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build site (strict)
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    env:
      DEPLOY_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Verify current main and CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          main_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          test "$DEPLOY_SHA" = "$main_sha"
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
              -f head_sha="$DEPLOY_SHA" -f branch=main -f status=success -f per_page=100 |
              jq -e --arg sha "$DEPLOY_SHA" \
                '[.workflow_runs[] | select(.head_sha == $sha and .conclusion == "success" and .event == "push")] | length > 0'
          fi
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ env.DEPLOY_SHA }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"
      - name: Install
        run: |
          python -m pip install --upgrade pip setuptools
          python -m pip install -e ".[docs]"
      - name: Build site (strict)
        env:
          NO_MKDOCS_2_WARNING: "1"
        run: python -m mkdocs build --strict --site-dir "$RUNNER_TEMP/site"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/site

  deploy:
    name: deploy to GitHub Pages
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
