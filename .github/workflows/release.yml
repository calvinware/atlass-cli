name: Release

# Publishes to PyPI with Trusted Publishing (OIDC). No PyPI API token or password is used.
# One-time PyPI and GitHub setup is in docs/contributing.md#release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: verify release provenance
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      # Fails unless the tag is v<project.version>, the commit is on main's first-parent history,
      # and CI passed for that exact commit on main. See scripts/release_gate.py.
      - name: Tag is a CI-passing commit on main
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git rev-list --first-parent origin/main > "$RUNNER_TEMP/main-history.txt"
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&branch=main&event=push&per_page=100" \
            > "$RUNNER_TEMP/ci-runs.json"
          python scripts/release_gate.py --ref "$GITHUB_REF" --sha "$GITHUB_SHA" \
            --main-history "$RUNNER_TEMP/main-history.txt" --ci-runs "$RUNNER_TEMP/ci-runs.json"

  build:
    name: build and check
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip setuptools
          python -m pip install -e ".[dev]"
      - name: Test
        run: python -m pytest -q
      - name: Build
        run: python -m build
      - name: Check distributions
        shell: bash
        run: |
          python -m twine check --strict dist/*
          python scripts/check_package.py dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/yojo/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/
