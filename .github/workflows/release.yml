name: Release

# Publishes to PyPI with Trusted Publishing (OIDC). No API token or password is used anywhere.
# One-time PyPI and GitHub setup is in docs/contributing.md#release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build and check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Tag matches project.version
        shell: bash
        run: |
          python - <<'PY'
          import os, sys, tomllib
          with open("pyproject.toml", "rb") as f:
              version = tomllib.load(f)["project"]["version"]
          ref = os.environ["GITHUB_REF"]
          if ref != f"refs/tags/v{version}":
              print(f"::error::{ref!r} does not match project.version; expected refs/tags/v{version}")
              sys.exit(1)
          print(f"releasing {version}")
          PY
      - name: Install
        run: |
          python -m pip install --upgrade pip setuptools
          python -m pip install -e ".[dev]"
      - name: Test
        run: python -m pytest -q
      - name: Build
        run: python -m build
      - name: Check distributions
        shell: bash
        run: python -m twine check --strict dist/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/atlass-cli/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/
