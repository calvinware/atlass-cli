name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install --upgrade pip setuptools
          python -m pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check .
      - name: Type check
        run: python -m mypy
      - name: Test
        run: python -m pytest -q
      - name: Build
        shell: bash
        run: |
          python -m build 2>&1 | tee build.log
          test "${PIPESTATUS[0]}" -eq 0
          if grep -Ei "license.*(TOML table|deprecated)|deprecated.*license" build.log; then
            echo "::error::Build emitted a deprecated license metadata warning"
            exit 1
          fi
      - name: Check license metadata
        shell: bash
        run: |
          python - <<'PY'
          import glob, tarfile, zipfile
          expected = "License-Expression: LicenseRef-Proprietary"
          (wheel,) = glob.glob("dist/*.whl")
          (sdist,) = glob.glob("dist/*.tar.gz")
          with zipfile.ZipFile(wheel) as zf:
              (name,) = [n for n in zf.namelist() if n.endswith(".dist-info/METADATA")]
              wheel_meta = zf.read(name).decode()
          with tarfile.open(sdist) as tf:
              (member,) = [m for m in tf.getmembers() if m.name.count("/") == 1 and m.name.endswith("/PKG-INFO")]
              sdist_meta = tf.extractfile(member).read().decode()
          for label, meta in (("wheel", wheel_meta), ("sdist", sdist_meta)):
              lines = meta.split("\n\n", 1)[0].splitlines()
              assert expected in lines, f"{label} metadata is missing {expected!r}"
              assert not any(l.startswith("License: ") for l in lines), f"{label} has a legacy License field"
          print("license metadata ok")
          PY
      - name: Installed CLI smoke check
        shell: bash
        run: |
          python -m venv smoke
          if [ -f smoke/Scripts/python.exe ]; then BIN=smoke/Scripts; else BIN=smoke/bin; fi
          "$BIN/python" -m pip install dist/*.whl
          "$BIN/atl" commands > commands.json
          "$BIN/atl" schema 'jira story create' > schema.json
          "$BIN/python" -c "import json; from atlass_cli.contracts import COMMANDS; d=json.load(open('commands.json')); assert d['ok'] and [c['path'] for c in d['data']['commands']] == [c.path for c in COMMANDS]"
          python -c "import json; d=json.load(open('schema.json')); assert d['ok'] and d['data']['command'] == 'jira story create'"

  docs:
    name: docs (reference, site, links)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip setuptools
          python -m pip install -e ".[dev,docs]"
      - name: Command reference is up to date
        run: python scripts/generate_command_reference.py --check
      - name: Docs tests, including the built-site checks
        env:
          ATL_REQUIRE_SITE_BUILD: "1"
        run: python -m pytest -q tests/test_docs.py
      - name: Build site (strict)
        env:
          NO_MKDOCS_2_WARNING: "1"
        run: python -m mkdocs build --strict
      - name: Working tree is clean
        shell: bash
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --porcelain
            echo "::error::Docs generation or the site build changed or created tracked files"
            exit 1
          fi
      - name: Link check
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          lycheeVersion: v0.24.2
          args: --config lychee.toml README.md AGENTS.md 'docs/**/*.md'
          fail: true
          failIfEmpty: true
          output: ${{ runner.temp }}/lychee/out.md

  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip setuptools
          python -m pip install -e ".[dev]"
      - name: pip-audit
        run: python -m pip_audit --skip-editable
