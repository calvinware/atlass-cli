name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
      - name: Install
        run: |
          python -m pip install --upgrade pip setuptools
          python -m pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check .
      - name: Type check
        run: python -m mypy
      - name: Test
        run: python -m pytest -q
      - name: Build
        shell: bash
        run: |
          python -m build 2>&1 | tee build.log
          test "${PIPESTATUS[0]}" -eq 0
          if grep -Ei "license.*(TOML table|deprecated)|deprecated.*license" build.log; then
            echo "::error::Build emitted a deprecated license metadata warning"
            exit 1
          fi
      - name: Check distributions
        shell: bash
        run: python -m twine check --strict dist/*
      - name: Check package metadata and license
        run: python scripts/check_package.py dist
      - name: Installed CLI smoke check
        shell: bash
        run: |
          python -m venv smoke
          if [ -f smoke/Scripts/python.exe ]; then BIN=smoke/Scripts; else BIN=smoke/bin; fi
          "$BIN/python" -m pip install dist/*.whl
          "$BIN/python" -c "import yojo"
          "$BIN/yojo" --json commands > commands.json
          "$BIN/yojo" --json schema 'jira issue create' > schema.json
          "$BIN/python" -c "import json; from yojo.contracts import COMMANDS; d=json.load(open('commands.json')); assert d['ok'] and [c['path'] for c in d['data']['commands']] == [c.path for c in COMMANDS]"
          python -c "import json; d=json.load(open('schema.json')); assert d['ok'] and d['data']['command'] == 'jira issue create'"
          "$BIN/python" -c "import yojo, textual; from importlib.resources import files; assert files('yojo').joinpath('setup.tcss').is_file()"
          # Off a terminal, setup starts nothing: one usage_error envelope and exit 2.
          check_setup() {
            set +e
            "$BIN/yojo" "$@" < /dev/null > setup.json
            code=$?
            set -e
            test "$code" -eq 2
            python -c "import json; d=json.load(open('setup.json')); assert d['ok'] is False and d['error']['code'] == 'usage_error' and d['error']['details']['steps']"
          }
          check_setup --json setup
          check_setup setup

  docs:
    name: docs (reference, site, links, py${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
      - name: Install
        run: |
          python -m pip install --upgrade pip setuptools
          python -m pip install -e ".[dev,docs]"
      - name: Command reference is up to date
        run: python scripts/generate_command_reference.py --check
      - name: Docs tests, including the built-site checks
        env:
          YOJO_REQUIRE_SITE_BUILD: "1"
        run: python -m pytest -q tests/test_docs.py
      - name: Build site (strict)
        env:
          NO_MKDOCS_2_WARNING: "1"
        run: python -m mkdocs build --strict
      - name: Working tree is clean
        shell: bash
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --porcelain
            echo "::error::Docs generation or the site build changed or created tracked files"
            exit 1
          fi
      - name: Link check
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          lycheeVersion: v0.24.2
          args: --config lychee.toml README.md AGENTS.md 'docs/**/*.md'
          fail: true
          failIfEmpty: true
          output: ${{ runner.temp }}/lychee/out.md

  captures:
    name: setup captures (pinned Textual)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      # The SVGs are byte-for-byte renderer output; pin the renderer they were written with.
      - name: Install
        run: |
          python -m pip install --upgrade pip setuptools
          python -m pip install -e ".[dev]" "textual==8.2.8" "rich==15.0.0"
      - name: Committed setup captures match the app
        run: python scripts/capture_setup.py --check

  workflows:
    name: workflows (actionlint, release invariants)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ACTIONLINT_VERSION: "1.7.12"
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install actionlint (checksum verified)
        shell: bash
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/$archive"
          echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" actionlint
      - name: actionlint
        run: '"$RUNNER_TEMP/actionlint" -color'
      - name: Install
        run: |
          python -m pip install --upgrade pip setuptools
          python -m pip install -e ".[dev]"
      - name: Release workflow invariants and gate cases
        run: python -m pytest -q tests/test_release.py

  audit:
    name: dependency audit (py${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
      - name: Install
        run: |
          python -m pip install --upgrade pip setuptools
          python -m pip install -e ".[dev]"
      - name: pip-audit
        run: python -m pip_audit --skip-editable
