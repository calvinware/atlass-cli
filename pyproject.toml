[build-system]
requires = ["setuptools>=84.1", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "yojo"
version = "0.1.0"
description = "Generic, agent-first command line for Jira, Confluence, and Bitbucket Data Center: one JSON envelope, friendly terminal output."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Calvinware" }]
keywords = ["atlassian", "jira", "confluence", "bitbucket", "data-center", "cli", "automation", "ai-agents"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
dependencies = [
    "httpx>=0.28,<1",
    "jsonschema>=4.23,<5",
    "keyring>=25.5,<26",
    "PyYAML>=6.0.2,<7",
    "textual>=8.2,<9",
    "truststore>=0.10,<1",
]

[project.urls]
Homepage = "https://github.com/calvinware/yojo"
Documentation = "https://github.com/calvinware/yojo/tree/main/docs"
Repository = "https://github.com/calvinware/yojo"
Issues = "https://github.com/calvinware/yojo/issues"

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "mypy>=1.13",
    "pip-audit>=2.7",
    "pytest>=8.3",
    "ruff>=0.8",
    "twine>=6",
    "types-jsonschema",
    "types-PyYAML",
]
# Documentation site tooling, pinned to the versions the docs CI job is tested with.
docs = [
    "mkdocs==1.6.1",
    "mkdocs-github-admonitions-plugin==0.1.1",
    "mkdocs-material==9.8.0",
]

[project.scripts]
yojo = "yojo.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
yojo = ["py.typed", "setup.tcss"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
files = ["src", "tests", "scripts"]

[[tool.mypy.overrides]]
module = ["keyring.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "BLE", "SIM", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108"]
