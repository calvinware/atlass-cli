[build-system]
requires = ["setuptools>=84.1", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "atlass-cli"
version = "1.0.0"
description = "Agent-first JSON CLI for Atlassian Jira and Confluence Data Center with team-defined workflow rules."
readme = "README.md"
requires-python = ">=3.11"
license = "LicenseRef-Proprietary"
license-files = []
authors = [{ name = "Calvinware" }]
classifiers = [
    "Environment :: Console",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "httpx>=0.28,<1",
    "jsonschema>=4.23,<5",
    "keyring>=25.5,<26",
    "PyYAML>=6.0.2,<7",
    "truststore>=0.10,<1",
]

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "mypy>=1.13",
    "pip-audit>=2.7",
    "pytest>=8.3",
    "ruff>=0.8",
    "types-jsonschema",
    "types-PyYAML",
]
# Documentation site tooling, pinned to the versions the docs CI job is tested with.
docs = [
    "mkdocs==1.6.1",
    "mkdocs-github-admonitions-plugin==0.1.1",
    "mkdocs-material==9.8.0",
]

[project.scripts]
atl = "atlass_cli.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
atlass_cli = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
files = ["src", "tests", "scripts"]

[[tool.mypy.overrides]]
module = ["keyring.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "BLE", "SIM", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108"]
